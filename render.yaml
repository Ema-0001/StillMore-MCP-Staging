services:
  - type: web
    name: stillmore-mcp-staging
    runtime: node
    plan: free
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: PUBLIC_BASE_URL
        sync: false
      - key: OAUTH_ISSUER
        sync: false
      - key: OAUTH_AUDIENCE
        sync: false
      - key: OAUTH_JWKS_URI
        sync: false
      - key: STILLMORE_DATA_DIR
        value: /tmp/stillmore-staging-data
